<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f2e7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#12100e" media="(prefers-color-scheme: dark)" />
<meta name="description" content="按 1·2·4·7·14·21 天复习曲线自动排计划，并把 2026-12-19 考研初试纳入倒推。" />
<title>复习曲线 · 考研倒计时</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="复习曲线" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">复习曲线</span>
    </div>
    <span id="examPill" class="pill pill-exam"></span>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <button id="fab" class="fab" type="button">
    <span class="fab-plus" aria-hidden="true">+</span>
    <span class="fab-text">录入今天的学习</span>
  </button>

  <nav id="tabbar" class="tabbar" aria-label="主导航">
    <button class="tab" data-view="today" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H19v16H6.5A2.5 2.5 0 0 1 4 17.5v-11Z"/><path d="M8 8.5h7M8 12.5h5"/></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-view="plan" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3.5 2"/><circle cx="12" cy="12" r="8.2"/></svg>
      <span>计划</span>
    </button>
    <button class="tab" data-view="items" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
      <span>知识点</span>
    </button>
    <button class="tab" data-view="settings" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4 6 18M18 18l-1.6-1.6M7.6 7.6 6 6"/></svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="scrim" data-action="close-sheet"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
