name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "js/**"
      - "css/**"
      - "index.html"
      - "icons/**"
      - "tools/build-android-assets.mjs"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 单元测试
        run: node --test test/scheduler.test.mjs

      - name: 准备签名密钥
        run: |
          : > android/keystore.p12
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > android/keystore.p12
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: 构建 APK
        run: bash android/build-apk.sh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: kaoyan-review-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: 首次生成的签名密钥留档
        run: |
          if [ -f .build-android/kaoyan.keystore ]; then
            cp .build-android/kaoyan.keystore dist/kaoyan.keystore
          fi

      - name: 上传签名密钥（仅一次性密钥时存在）
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: dist/kaoyan.keystore
          if-no-files-found: ignore
